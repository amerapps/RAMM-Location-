<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المواقع</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#17181A;
    --panel:#202124;
    --panel2:#27282C;
    --line:#37383D;
    --line-bright:#4A4B51;
    --text:#EDEDEE;
    --muted:#8D8E93;
    --orange:#D9622B;
    --orange-bright:#F2874A;
    --orange-dim:#7A3A18;
    --danger:#E5484D;
    --ok:#7CB88A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 10% -10%, rgba(217,98,43,0.10), transparent 45%),
      radial-gradient(ellipse at 100% 110%, rgba(217,98,43,0.06), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Rubik', sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  header .title{
    font-family:'Oswald', sans-serif;
    font-weight:700; font-size:21px; letter-spacing:0.3px;
    text-transform:uppercase;
  }
  header .title span{color:var(--orange);}
  header .sub{color:var(--muted); font-size:12px; margin-top:3px;}
  .count-badge{
    font-family:'IBM Plex Mono', monospace;
    background:var(--panel2); border:1px solid var(--line);
    color:var(--orange-bright); font-size:12px; padding:6px 12px; border-radius:4px;
    white-space:nowrap;
  }

  /* Dispatch console */
  .console{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.02);
    position:relative;
    overflow:hidden;
  }
  .console::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:5px;
    background:repeating-linear-gradient(-45deg, var(--orange) 0 10px, #1A1A1C 10px 20px);
    opacity:0.85;
  }
  .console-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--muted); letter-spacing:1.5px; margin:8px 0 12px;
    display:flex; align-items:center; gap:7px; text-transform:uppercase;
  }
  .console-label .dot{width:6px; height:6px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px rgba(217,98,43,0.7);}

  .code-row{display:flex; gap:10px; align-items:center;}
  #codeInput{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:32px; font-weight:600;
    background:#101113;
    border:1px solid var(--line-bright);
    border-radius:8px;
    color:var(--orange-bright);
    text-align:center;
    padding:14px 10px;
    letter-spacing:5px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  #codeInput:focus{border-color:var(--orange); box-shadow:0 0 0 3px rgba(217,98,43,0.15);}
  #codeInput::placeholder{color:#4A4B51; letter-spacing:2px;}

  .go-btn{
    font-family:'Oswald', sans-serif;
    font-weight:600; font-size:14px; letter-spacing:0.5px; text-transform:uppercase;
    background:var(--orange); color:#1A1200;
    border:none; border-radius:8px;
    padding:0 22px; height:62px;
    cursor:pointer;
    transition:transform .1s, background .15s;
    white-space:nowrap;
  }
  .go-btn:active{transform:scale(0.96);}
  .go-btn:hover{background:var(--orange-bright);}

  .live-match{
    margin-top:12px; min-height:22px;
    font-size:13px; color:var(--muted);
  }
  .live-match b{color:var(--ok); font-weight:600;}
  .live-match.notfound{color:var(--danger);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--orange-dim); color:var(--text);
    padding:11px 20px; border-radius:8px; font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* Mobile tightening */
  html, body{overflow-x:hidden; width:100%;}
  @media (max-width:420px){
    body{padding:16px 10px 50px;}
    header .title{font-size:18px;}
    .console{padding:16px;}
    .code-row{flex-wrap:wrap;}
    #codeInput{font-size:26px; letter-spacing:3px; padding:12px 8px; width:100%;}
    .go-btn{height:52px; width:100%; font-size:13px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="title">لوحة <span>المواقع</span></div>
      <div class="sub">دخّل الرقم، افتح الموقع على طول</div>
    </div>
    <div class="count-badge" id="countBadge">0 موقع</div>
  </header>

  <div class="console">
    <div class="console-label"><span class="dot"></span> إدخال الرقم</div>
    <div class="code-row">
      <input id="codeInput" type="text" inputmode="numeric" placeholder="ادخل رقم الموقع…" autocomplete="off">
      <button class="go-btn" id="goBtn">افتح 📍</button>
    </div>
    <div class="live-match" id="liveMatch"></div>
  </div>

</div>


<div class="toast" id="toast"></div>

function loadData(){
  // المصدر الوحيد للبيانات هو ملف الاكسل، يتحدث يدويا كل ما تنحدث القائمة
  locations = DEFAULT_LOCATIONS.slice();
  updateCount();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function updateCount(){
  document.getElementById('countBadge').textContent = locations.length + (locations.length===1?' موقع':' مواقع');
}

function resolveUrl(raw){
  if(!raw) return null;
  raw = raw.toString().trim();
  if(raw.startsWith('http')) return raw;
  // lat,lng pattern
  const m = raw.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
  if(m) return `https://www.google.com/maps?q=${m[1]},${m[2]}`;
  // treat as a place search
  return `https://www.google.com/maps/search/${encodeURIComponent(raw)}`;
}

function findByNumber(num){
  return locations.find(l => l.number.toString() === num.toString().trim());
}

function openLocation(loc){
  if(!loc) return;
  window.open(resolveUrl(loc.link), '_blank');
}

// --- Console input ---
const codeInput = document.getElementById('codeInput');
const liveMatch = document.getElementById('liveMatch');

codeInput.addEventListener('input', ()=>{
  const val = codeInput.value.trim();
  if(!val){ liveMatch.textContent=''; liveMatch.classList.remove('notfound'); return; }
  const found = findByNumber(val);
  if(found){
    liveMatch.classList.remove('notfound');
    liveMatch.innerHTML = `✅ الموقع <b>${found.number}</b> موجود، دوس فتح`;
  }else{
    liveMatch.classList.add('notfound');
    liveMatch.textContent = '❌ ما في موقع بهيك رقم';
  }
});

codeInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('goBtn').click();
});

document.getElementById('goBtn').addEventListener('click', ()=>{
  const val = codeInput.value.trim();
  if(!val){ showToast('دخّل رقم الموقع الأول'); return; }
  const found = findByNumber(val);
  if(found){
    openLocation(found);
  }else{
    showToast('ما لقيت موقع بهالرقم');
  }
});

loadData();
</script>
</body>
</html>
